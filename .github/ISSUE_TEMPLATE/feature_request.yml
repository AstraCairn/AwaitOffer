name: 功能建议
description: 描述实际使用场景和希望解决的问题
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你目前如何操作，哪一步遇到困难？请勿包含个人求职记录或凭证。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 如涉及新站点，请说明官网域名、招聘平台和可验证范围，不提供账号或密钥。
    validations:
      required: true
